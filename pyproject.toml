[project]
name = "nla-vision"
version = "0.1.0"
description = "Image inference with Gemma3 NLAs based on Anthropic's natural language autoencoders"
readme = "README.md"
requires-python = ">=3.11"
dependencies =[
    "torch==2.9.1",
    "transformers",
    "safetensors",
    "httpx",
    "orjson",
    "pyyaml",
    "numpy",
    "pyarrow",
    "huggingface-hub[cli]",
    "pillow>=12.3.0",
    "accelerate>=1.14.0",
]

# The host driver is CUDA 12.2; the default PyPI torch ships cu130 wheels that
# fail CUDA init and silently fall back to CPU.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nla_vision"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
